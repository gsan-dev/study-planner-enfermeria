# Desarrollo con hot reload: docker compose -f docker-compose.dev.yml up --build
#   Frontend → http://localhost:5173
#   API      → http://localhost:4000/api/health
#   MongoDB  → mongodb://localhost:27017 (sin autenticación, solo para desarrollo)
name: study-planner-dev

services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    command: npm run dev:docker
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/study-planner
      JWT_SECRET: dev-secret-no-usar-en-produccion-0123456789
      CORS_ORIGINS: "*"
      LOG_LEVEL: debug
      # Opcional: escaneo de horarios. Se lee del .env de la raíz o del entorno.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      target: dev
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:4000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_dev_data:
